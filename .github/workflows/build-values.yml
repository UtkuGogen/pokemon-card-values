name: Build value index

on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of every month
  workflow_dispatch: {} # adds a manual "Run workflow" button

permissions:
  contents: write # lets the action commit the regenerated file

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node buildValueIndex.mjs
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cardValues.json
          git diff --staged --quiet || git commit -m "chore: refresh value index"
          git push
